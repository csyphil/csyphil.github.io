<div class="modal fade search-modal" id="search-modal">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body">
                <div id="search" class="s-search mx-auto my-4">
                    <div id="search-list" class="hide-type-list">
                        <div class="s-type">
                            <span></span>
                            <div class="s-type-list">
                                <label for="m_type-google"   data-id="group-a">常用</label>
                                <label for="m_type-zhihu"    data-id="group-b">社区</label>
                                <label for="m_type-taobao"   data-id="group-c">生活</label>
                            </div>
                        </div>
                        <div class="search-group group-a"><span class="type-text text-muted">常用</span>
                            <ul class="search-type">
                                <li><input hidden="" type="radio" name="type2" id="m_type-google" 
                                    value="https://www.google.com/search?q=" 
                                    data-placeholder="Don't be evil">
                                    <label for="m_type-google"><span class="text-muted">Google</span></label></li>
                                <li><input hidden="" type="radio" name="type2" id="m_type-baidu"
                                    value="https://www.baidu.com/s?wd=" 
                                    data-placeholder="百度一下，你就知道">
                                    <label for="m_type-baidu"><span class="text-muted">百度</span></label></li>
                                <li><input hidden="" type="radio" name="type2" id="m_type-bing"
                                    value="https://cn.bing.com/search?q=" 
                                    data-placeholder="快乐搜索，有求必应">
                                    <label for="m_type-bing"><span class="text-muted">必应</span></label></li>
                                <li><input hidden="" type="radio" name="type2" id="m_type-ghbk"
                                    value="https://www.ghxi.com/?s=" 
                                    data-placeholder="果核剥壳 | 搜索绿色软件">
                                    <label for="m_type-ghbk"><span class="text-muted">软件</span></label></li>
                            </ul>
                        </div>
                        <div class="search-group group-b"><span class="type-text text-muted">社区</span>
                            <ul class="search-type">
                                <li><input hidden="" type="radio" name="type2" id="m_type-zhihu"
                                    value="https://www.zhihu.com/search?type=content&q=" 
                                    data-placeholder="有问题，就会有答案">
                                    <label for="m_type-zhihu"><span class="text-muted">知乎</span></label></li>
                                <li><input hidden="" type="radio" name="type2" id="m_type-xhs" 
                                    value="https://www.xiaohongshu.com/search_result?keyword=" 
                                    data-placeholder="你的生活指南">
                                    <label for="m_type-xhs"><span class="text-muted">小红书</span></label></li>
                                <li><input hidden="" type="radio" name="type2" id="m_type-weixin"
                                    value="https://weixin.sogou.com/weixin?type=2&query=" 
                                    data-placeholder="搜狗 | 微信文章搜索">
                                    <label for="m_type-weixin"><span class="text-muted">微信</span></label></li>
                                <li><input hidden="" type="radio" name="type2" id="m_type-weibo"
                                    value="https://s.weibo.com/weibo/" 
                                    data-placeholder="随时随地发现新鲜事！">
                                    <label for="m_type-weibo"><span class="text-muted">微博</span></label></li>
                                <li><input hidden="" type="radio" name="type2" id="m_type-douban"
                                    value="https://www.douban.com/search?q=" 
                                    data-placeholder="汇聚一亿人生活趣味">
                                    <label for="m_type-douban"><span class="text-muted">豆瓣</span></label></li>
                            </ul>
                        </div>
                        <div class="search-group group-c"><span class="type-text text-muted">生活</span>
                            <ul class="search-type">
                                <li><input hidden="" type="radio" name="type2" id="m_type-taobao"
                                    value="https://s.taobao.com/search?q=" 
                                    data-placeholder="淘宝·太好逛了吧！">
                                    <label for="m_type-taobao"><span class="text-muted">淘宝</span></label></li>
                                <li><input hidden="" type="radio" name="type2" id="m_type-jd"
                                    value="https://search.jd.com/Search?keyword=" 
                                    data-placeholder="京东·不负每一份热爱">
                                    <label for="m_type-jd"><span class="text-muted">京东</span></label></li>
                                <li><input hidden="" type="radio" name="type2" id="m_type-tmall" 
                                    value="https://s.taobao.com/search?fromTmallRedirect=true&q=" 
                                    data-placeholder="理想生活上天猫">
                                    <label for="m_type-tmall"><span class="text-muted">天猫</span></label></li>
                                <li><input hidden="" type="radio" name="type2" id="m_type-kd100" 
                                    value="https://kuaidi100.com/?nu=" 
                                    data-placeholder="请输入快递单号">
                                    <label for="m_type-kd100"><span class="text-muted">快递100</span></label></li>
                                <li><input hidden="" type="radio" name="type2" id="m_type-drug" 
                                    value="https://www.dayi.org.cn/search?keyword=" 
                                    data-placeholder="请输入您要查询的疾病、症状、医院、医生、药品 | 中国医药信息查询平台">
                                    <label for="m_type-drug"><span class="text-muted">国药查询</span></label></li>
                                <li><input hidden="" type="radio" name="type2" id="m_type-dingxiang" 
                                    value="https://drugs.dxy.cn/pc/search?keyword=" 
                                    data-placeholder="丁香园·搜索疾病、指南、药品">
                                    <label for="m_type-dingxiang"><span class="text-muted">丁香用药</span></label></li>
                                <li><input hidden="" type="radio" name="type2" id="m_type-gjkd" 
                                    value="https://t.17track.net/zh-cn#nums=" 
                                    data-placeholder="请输入国际快递单号">
                                    <label for="m_type-gjkd"><span class="text-muted">国际快件</span></label></li>
                            </ul>
                        </div>
                    </div>
                    <form action="https://www.baidu.com/s?wd=" method="get" target="_blank" class="super-search-fm">
                        <input type="text" id="m_search-text" class="form-control smart-tips search-key" zhannei=""
                                autocomplete="off" placeholder="输入关键字搜索" style="outline:0">
                        <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </form>
                </div>
            </div>
            <div style="position: absolute;bottom: -40px;width: 100%;text-align: center;">
                <a href="javascript:" data-dismiss="modal"><i class="fa-solid fa-circle-xmark fa-2x" style="color: #fff;"></i></a>
            </div>
        </div>
    </div>
</div>
